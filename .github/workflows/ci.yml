name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint → typecheck → test → build → bundle gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Per-route JavaScript budget (KB, raw uncompressed). Calibrated for
      # Dealflow's realtime + kanban core (see scripts/bundle-gate.mjs).
      BUNDLE_BUDGET_KB: "800"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle-size gate
        run: npm run bundle:gate
